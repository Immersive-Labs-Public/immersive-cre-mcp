[project]
name = "immersive-cre-mcp"
version = "0.3.0"
description = "MCP server for immersive Cyber Ranges"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "kevthehermit", email = "kevin@immersivelabs.com" }
]
keywords = ["mcp", "model-context-protocol", "immersive-labs", "cyber-range", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3",
    "pydantic-settings>=2.15.0",
]

[project.urls]
Homepage = "https://github.com/Immersive-Labs-Public/immersive-cre-mcp"
Repository = "https://github.com/Immersive-Labs-Public/immersive-cre-mcp"
Issues = "https://github.com/Immersive-Labs-Public/immersive-cre-mcp/issues"

[project.scripts]
immersive-cre-mcp = "immersive_cre_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "respx>=0.22",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF"]
# Long lines are mostly docstrings and API payloads; the formatter isn't enforced.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.coverage.run]
source = ["immersive_cre_mcp"]
branch = true
